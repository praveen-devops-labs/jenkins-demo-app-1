name: Detect Code Risk

on:
  workflow_call:
    
jobs:
  detect-risk:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Risk Detection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
        run: |
          chmod +x .github/scripts/detect_risk.sh
          .github/scripts/detect_risk.sh
