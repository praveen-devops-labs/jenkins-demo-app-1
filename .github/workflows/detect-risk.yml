name: Detect Code Risk

on:
  pull_request:
    branches:
      - dev-login
      - qa-testing
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-risk:
    uses: praveen-devops-labs/jenkins-demo-app-1/.github/workflows/detect-risk-reusable.yml@main

    secrets: inherit
