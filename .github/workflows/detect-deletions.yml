name: Detect Code Deletions

on:
  push:
    branches:
      - qa-testing
      - dev-login

  pull_request:
    branches:
      - dev-login
      - qa-testing
    types:
      - opened
      - synchronize
      - reopened

jobs:
  detect-deletions:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run deletion detector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
        run: |
          chmod +x .github/scripts/detect_deletions.sh
          .github/scripts/detect_deletions.sh
