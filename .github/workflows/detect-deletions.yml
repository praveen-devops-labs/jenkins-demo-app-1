name: Detect Code Deletions

on:
  push:
    branches:
      - dev-login
      - qa-testing

jobs:
  detect-deletions:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install GitHub CLI
        run: |
          gh --version

      - name: Detect deletions and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
        run: |
          chmod +x .github/scripts/detect_deletions.sh
          .github/scripts/detect_deletions.sh
